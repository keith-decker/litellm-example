services:
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm_password_change_in_prod}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm_user -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  litellm-cisco:
    build:
      context: .
      dockerfile: Dockerfile.cisco
    container_name: litellm-cisco
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database Configuration
      DATABASE_URL: postgresql://litellm_user:${POSTGRES_PASSWORD:-litellm_password_change_in_prod}@postgres:5432/litellm
      
      # Cisco Credentials
      CISCO_CLIENT_ID: ${CISCO_CLIENT_ID}
      CISCO_CLIENT_SECRET: ${CISCO_CLIENT_SECRET}
      CISCO_APP_KEY: ${CISCO_APP_KEY:-}
      
      # LiteLLM Settings
      LITELLM_DEBUG: "true"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-master-key-change-in-prod}
      
      # Team API Keys (for automated setup)
      TEAM_A_KEY: ${TEAM_A_KEY:-sk-team-a-key-12345}
      TEAM_B_KEY: ${TEAM_B_KEY:-sk-team-b-key-67890}
      
      # OpenTelemetry Settings
      LITELLM_OTEL_INTEGRATION_ENABLE_METRICS: "true"
      LITELLM_OTEL_INTEGRATION_ENABLE_EVENTS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://host.docker.internal:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "Delta"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=dev,service.name=litellm-cisco,service.version=1.81.0"
      
      # Other Model API Keys
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-9999}
      
      # Python path to ensure modules are discoverable
      PYTHONPATH: /app
      
    ports:
      - "127.0.0.1:4000:4000"  # Bind to localhost only for security
    
    volumes:
      # Mount config (optional if baked into image)
      - ./cisco-llm.yml:/app/config.yaml:ro
      # Mount Cisco integration modules (override image versions)
      - ./cisco_callback.py:/app/cisco_callback.py:ro
      - ./cisco_provider.py:/app/cisco_provider.py:ro
      
      # Mount token cache directory for persistence across restarts
      - cisco-token-cache:/tmp
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres-data:
    driver: local
  cisco-token-cache:
    driver: local

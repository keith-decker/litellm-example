model_list:
  - model_name: gpt-4.1
    litellm_params:
      model: gpt-4-turbo-preview
      api_key: os.environ/OPENAI_API_KEY
  - model_name: "cisco-llm"
    litellm_params:
      model: openai/gpt-4o-mini
      api_base: "https://chat-ai.cisco.com/openai/deployments/gpt-4o-mini"
      api_key: os.environ/CISCO_API_TOKEN  # Token fetched via OAuth2
      custom_llm_provider: openai

litellm_settings:
  callbacks: ["otel", "cisco_callback.cisco_handler"]
  success_callback: ["otel"]
  failure_callback: ["otel"]

general_settings:
  # Authentication disabled for local development
  # SECURITY: Only safe because proxy is bound to localhost (127.0.0.1)
  # For production: use master_key + database OR deploy behind authenticated gateway
  otel: true  # Enable OpenTelemetry logging
  disable_spend_logs: true  # Disable spend tracking (no database needed)